name: Skills eval (behavioural)

# Tier 2 of the testing model in docs/adr/0012: behavioural evals of the shipped
# skills against synthetic GlassFrog fixtures. Nightly and on demand, never on a
# PR — these cost model calls and wall-clock, and ADR-0012's whole argument is
# that a per-PR gate must be deterministic, offline and sub-second. That gate is
# scripts-test.yml; this is the other tier.
#
# TWO JOBS, AND THE SPLIT IS THE POINT
# ------------------------------------
# `offline` needs no credentials and always runs. It exercises every path in
# scripts/run-behavioural-eval.py except the literal `claude` invocation, and it
# probes each shipped fixture by starting the stub from the config a real run
# would generate. So a broken runner is caught even on a night when the API key
# is missing, rate-limited, or revoked.
#
# `graded` needs ANTHROPIC_API_KEY. When the secret is absent it reports that
# plainly and succeeds. Issue #171 asks for exactly this: the secret is a
# separate human action, and a workflow that goes red every night until someone
# performs it trains people to ignore a red workflow. What it must NOT do is
# report health it did not measure — hence the explicit notice, and hence
# `offline` carrying the assertions that can run unconditionally.
#
# WHY NOT FAIL ON A REGRESSION
# ----------------------------
# The eval-regression alarm is #173, and it is deliberately a separate piece of
# work with the three-layer idempotent shape release-latency-alarm.yml uses. This
# workflow produces benchmark.json and prints the delta against the committed
# baseline; deciding that a delta is a regression is that alarm's job. Wiring a
# threshold in here before the variance of these cases is known is how a flaky
# nightly gets muted.

on:
  schedule:
    # 07:00 UTC — midnight PDT / 23:00 PST the previous evening, so a nightly
    # result is waiting at the start of the operator's day rather than landing
    # mid-morning. GitHub does not guarantee the minute; nothing here depends on
    # it.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      runs:
        description: "Runs per (eval, config). More runs shrink the stddev; the flakiness read in evals/README.md needs at least 3."
        default: "3"
      model:
        description: "Model for both the executor and the grader (blank = the CLI default)"
        default: ""

permissions:
  contents: read

jobs:
  offline:
    name: Runner suite and fixture probes (no credentials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show interpreter versions
        run: |
          set -euo pipefail
          bash --version | head -1
          python3 --version

      - name: run-behavioural-eval regression suite
        # Mutation-checked, same contract as every other suite in this repo: for
        # each mechanical check there is a plan violating only that check, and
        # the suite asserts both that the check fails on it and that no other
        # check incidentally covers it.
        #
        # It substitutes a fake `claude` that replays a plan through the REAL
        # stub over the REAL generated MCP config, so the only thing not
        # exercised here is the model itself.
        run: bash scripts/run-behavioural-eval.test.sh

      - name: Validate every shipped case and probe its fixture
        # Catches the failure mode that would otherwise look like a skill
        # declining to act: a generated MCP config that does not actually start
        # the stub. A run broken this way still produces a transcript.
        run: |
          set -euo pipefail
          args=()
          for f in evals/cases/*/evals.json; do args+=(--case "$f"); done
          python3 scripts/run-behavioural-eval.py --out "$RUNNER_TEMP/probe" \
            --validate-only "${args[@]}"

  graded:
    name: Graded eval run
    needs: offline
    runs-on: ubuntu-latest
    # Measured, not guessed. Run 31053788703 spent ~36 minutes on the eval and
    # aggregate steps for THREE evals at runs=3 — and three only because #201
    # was silently dropping a fourth. Three evals at runs=3 over two configs is
    # 18 executions, so ~2 minutes each; four evals put the same work near 48
    # minutes, which left almost nothing against the previous ceiling of 60.
    # A timeout kills the job mid-step, so the whole budget is spent for no
    # benchmark.
    #
    # THIS NUMBER IS READ AT RUNTIME, NOT JUST OBEYED (#205). The `runs` range
    # check below parses it out of this file and derives the largest `runs`
    # that can finish inside it. Before that, the two were unrelated numbers
    # describing one constraint: `runs` accepted 1–10 while `runs=10` at four
    # evals needs ~160 minutes and provably cannot finish — a contributor got a
    # 90-minute wait and a red run with no signal about why. Raising or
    # lowering this value now moves the accepted range with it, so they cannot
    # drift apart.
    #
    # A YAML key cannot read an env var, so this literal is the single source
    # and the shell reads the file. Keep it the ONLY `timeout-minutes:` in this
    # workflow — the range check asserts exactly one exists and fails loudly
    # rather than silently reading the wrong job's ceiling.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check for the API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Behavioural evals skipped::ANTHROPIC_API_KEY is not set on this repository, so the graded tier did not run. The offline job still verified the runner and every fixture. Add the secret to enable the nightly graded run (issue #171)."
            {
              echo "## Graded evals skipped"
              echo
              echo "\`ANTHROPIC_API_KEY\` is not configured on this repository."
              echo "The \`offline\` job verified the runner and probed every fixture;"
              echo "nothing was measured about skill behaviour."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: "22"

      - name: Install the Claude Code CLI
        if: steps.key.outputs.present == 'true'
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Fetch skill-creator's aggregator
        if: steps.key.outputs.present == 'true'
        # Cloned rather than vendored. ADR-0012 reuses aggregate_benchmark.py
        # as-is; a copy in this repo would drift from it silently, and the
        # mean ± stddev and with/without delta it computes are the reason the
        # component was chosen over writing one.
        #
        # PINNED TO A COMMIT (issue #195). "Not vendored" and "not pinned" are
        # separable choices, and until #195 we had neither the isolation of a
        # copy nor the stability of a pin: this fetched upstream's default
        # branch, so their layout was ours to track on their schedule. It has
        # already moved once — the path gained a `skills/skill-creator/` segment
        # — and because the graded tier had never actually run (no API key, so
        # every green run took the skip-with-notice path) that break sat latent
        # from the day this workflow was written until the first real dispatch,
        # where it failed in two seconds. Fixing the path did not remove the
        # exposure; the next reorganization would break the nightly run again,
        # at a time nobody chose. A pinned commit makes upstream's changes
        # arrive as a diff someone approves.
        #
        # `test -f` stays regardless. A pin narrows WHEN an upstream move can
        # reach us; it does not make the resolved path self-verifying, and this
        # guard is what turns a wrong path into a loud two-second failure rather
        # than a confusing one at the Aggregate step. The resolved path is still
        # exported once, so a move is a one-line fix rather than three edits with
        # a chance of a partial one.
        #
        # TO BUMP: set AGGREGATOR_SHA to the new commit, then re-verify by
        # dispatching a graded run — the offline job does not exercise this step
        # at all, so a bad pin is invisible until a graded run touches it. Read
        # upstream's diff for aggregate_benchmark.py before bumping: the "Report
        # against the committed baseline" step below parses the schema this
        # script writes, and #199 was a crash caused by that schema, not by the
        # path. A pin does not protect that step; it only decides when the
        # schema change arrives.
        #
        #   gh api repos/anthropics/claude-plugins-official/commits/main -q .sha
        env:
          # Tip of anthropics/claude-plugins-official main as of 2026-08-06.
          AGGREGATOR_SHA: "36b00173da517876f9e574ef98f3564b0e86c25d"
        run: |
          set -euo pipefail
          # init + fetch <sha> rather than `clone --depth 1`, because a shallow
          # clone can only resolve a branch or tag name. Fetching the commit
          # directly keeps the shallow, blobless, sparse shape while making the
          # revision content-addressed.
          spc="$RUNNER_TEMP/spc"
          git init -q "$spc"
          git -C "$spc" remote add origin \
            https://github.com/anthropics/claude-plugins-official.git
          git -C "$spc" sparse-checkout set --cone \
            plugins/skill-creator/skills/skill-creator/scripts
          git -C "$spc" fetch -q --depth 1 --filter=blob:none origin "$AGGREGATOR_SHA"
          git -C "$spc" checkout -q FETCH_HEAD

          # git verifies the object it fetched, so this cannot disagree — which
          # is the point of asserting it. If it ever does, something has replaced
          # the fetch with a resolution step and the pin has stopped being a pin.
          resolved=$(git -C "$spc" rev-parse HEAD)
          if [ "$resolved" != "$AGGREGATOR_SHA" ]; then
            echo "::error::aggregator pin is ${AGGREGATOR_SHA} but HEAD resolved to ${resolved}"
            exit 1
          fi
          echo "aggregator pinned at $resolved"

          AGGREGATOR="$spc/plugins/skill-creator/skills/skill-creator/scripts/aggregate_benchmark.py"
          test -f "$AGGREGATOR"
          echo "AGGREGATOR=$AGGREGATOR" >> "$GITHUB_ENV"

      - name: Run the behavioural evals
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNS: ${{ inputs.runs || '3' }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          # Both are workflow_dispatch inputs, so they reach the shell only as
          # environment variables and are never interpolated into the command
          # line. RUNS is additionally range-checked: it is passed to a loop that
          # spends money AND has a wall-clock ceiling.
          case "$RUNS" in
            ''|*[!0-9]*) echo "runs must be a positive integer, got '$RUNS'" >&2; exit 1 ;;
          esac

          # The upper bound is DERIVED, not a constant (#205). It used to be a
          # flat 10 sitting next to an unrelated timeout-minutes, and the two
          # described one constraint: at four evals, runs=10 needs ~160 minutes
          # against a 90-minute ceiling. It could not finish, and the range
          # check accepted it anyway — 90 minutes of spend for a red run with
          # no signal about why. Deriving it converts that into a two-second
          # refusal showing the arithmetic.
          #
          # MINUTES_PER_EXECUTION is the measured rate: run 31053788703 spent
          # ~36 minutes on 3 evals × 3 runs × 2 configs = 18 executions.
          # OVERHEAD_MINUTES covers everything either side of the loop —
          # checkout, node, the CLI install, the aggregator fetch, aggregate,
          # report, upload — plus slack for a slow runner.
          MINUTES_PER_EXECUTION=2
          OVERHEAD_MINUTES=10
          CONFIGS=2   # with_skill, without_skill — run-behavioural-eval.py's DEFAULT_CONFIGS

          # Read the ceiling out of this file rather than restating it, so the
          # job's timeout and this bound cannot drift apart. Exactly one
          # timeout-minutes must exist; more than one and we would be silently
          # deriving from the wrong job.
          WORKFLOW=.github/workflows/skills-eval.yml
          timeouts=$(grep -cE '^[[:space:]]*timeout-minutes:' "$WORKFLOW")
          if [ "$timeouts" -ne 1 ]; then
            echo "expected exactly one timeout-minutes in $WORKFLOW, found $timeouts;" >&2
            echo "the runs ceiling is derived from it and cannot tell which job it belongs to" >&2
            exit 1
          fi
          TIMEOUT_MINUTES=$(grep -E '^[[:space:]]*timeout-minutes:' "$WORKFLOW" | tr -dc '0-9')

          # Counted from the case files, not from a number kept in step with
          # them by hand — #201 was a whole eval silently vanishing, and a
          # hard-coded count would make the ceiling wrong in exactly that case.
          EVALS=$(python3 -c 'import glob,json;print(sum(len(json.load(open(f))["evals"]) for f in glob.glob("evals/cases/*/evals.json")))')
          BUDGET=$((TIMEOUT_MINUTES - OVERHEAD_MINUTES))
          PER_RUN=$((MINUTES_PER_EXECUTION * EVALS * CONFIGS))
          MAX_RUNS=$((BUDGET / PER_RUN))

          # The original flat 10 was a SPEND guard, and wall clock has not
          # replaced it. Keep whichever binds first: a shrinking case count
          # must not quietly license a 20-run dispatch.
          SPEND_CAP=10
          if [ "$MAX_RUNS" -gt "$SPEND_CAP" ]; then MAX_RUNS=$SPEND_CAP; fi

          echo "$EVALS evals × $CONFIGS configs at ~${MINUTES_PER_EXECUTION}min each" \
               "= ${PER_RUN}min per run; ${BUDGET}min usable of ${TIMEOUT_MINUTES}" \
               "(spend cap $SPEND_CAP) => runs may be 1..$MAX_RUNS"

          if [ "$MAX_RUNS" -lt 1 ]; then
            echo "::error::even runs=1 needs ~${PER_RUN}min against a ${BUDGET}min budget." >&2
            echo "Raise timeout-minutes in $WORKFLOW, or reduce the case count." >&2
            exit 1
          fi
          if [ "$RUNS" -lt 1 ] || [ "$RUNS" -gt "$MAX_RUNS" ]; then
            echo "::error::runs must be between 1 and $MAX_RUNS, got '$RUNS'." >&2
            echo "runs=$RUNS needs ~$((RUNS * PER_RUN))min against a ${BUDGET}min budget" \
                 "(timeout-minutes: $TIMEOUT_MINUTES, minus ${OVERHEAD_MINUTES}min overhead)." >&2
            echo "Raise timeout-minutes in $WORKFLOW if this run is genuinely wanted." >&2
            exit 1
          fi

          args=()
          for f in evals/cases/*/evals.json; do args+=(--case "$f"); done
          if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
          python3 scripts/run-behavioural-eval.py \
            --out "$RUNNER_TEMP/benchmark" --runs "$RUNS" "${args[@]}"

      - name: Aggregate
        if: steps.key.outputs.present == 'true'
        # The aggregator defaults every metadata field to a literal placeholder
        # — `<skill-name>`, `<path/to/skill>`, `<model-name>` — and run
        # 31053788703 shipped all four (#203). A committed baseline that names
        # no skill is untidy; one that names no MODEL is a defect, because
        # #173's regression alarm compares a benchmark against a baseline and,
        # without the model, cannot tell a model upgrade from a skill
        # regression. It would misattribute the cause.
        #
        # `--skill-name`/`--skill-path` the aggregator accepts. The two model
        # fields it does NOT: they are hard-coded at its line 267, with no flag,
        # so they are stamped afterwards from what the runner observed. That is
        # also why the value comes from run_metadata.json rather than from the
        # `model` dispatch input — the input is blank on a default-model run,
        # which is precisely the run whose model a reader cannot otherwise name.
        run: |
          set -euo pipefail
          # Derived from the plugin manifest rather than hard-coded, so a rename
          # cannot leave the baseline describing something that no longer exists.
          SKILL_NAME=$(python3 -c \
            'import json;print(json.load(open(".claude-plugin/plugin.json"))["name"])')
          python3 "$AGGREGATOR" "$RUNNER_TEMP/benchmark" \
            --skill-name "$SKILL_NAME" --skill-path "$GITHUB_REPOSITORY"
          python3 - <<'PY'
          import importlib.util, json, os, pathlib
          bench = pathlib.Path(os.environ["RUNNER_TEMP"], "benchmark")
          data = json.loads((bench / "benchmark.json").read_text())
          run_meta = json.loads((bench / "run_metadata.json").read_text())
          meta = data["metadata"]

          def stamp(field, names):
              # None, never a placeholder or a guess, when nothing was observed.
              # A null says "unknown" to #173's alarm, which is true and
              # actionable; "<model-name>" says nothing while looking like data.
              if not names:
                  print(f"::warning::no {field} could be read off the event "
                        "streams; recording null")
                  meta[field] = None
              else:
                  # Joined rather than truncated: a benchmark that spanned two
                  # models must say so instead of picking one.
                  meta[field] = ", ".join(names)
                  if len(names) > 1:
                      print(f"::warning::{field} varied across this run: {meta[field]}")

          stamp("executor_model", run_meta.get("executor_models") or [])
          stamp("analyzer_model", run_meta.get("analyzer_models") or [])

          # The aggregator hard-codes this to 3 regardless of what ran, so a
          # runs=1 dispatch would otherwise produce a benchmark claiming 3.
          meta["runs_per_configuration"] = run_meta["runs_per_config"]
          meta["model_requested"] = run_meta.get("model") or None

          (bench / "benchmark.json").write_text(json.dumps(data, indent=2))

          # benchmark.md is rendered FROM this metadata, so stamping the JSON
          # alone would leave the human-readable half reading "**Model**:
          # <model-name>" — the artifact a person opens first. Re-rendered
          # through the aggregator's own function rather than a string
          # substitution, so the two files cannot drift.
          spec = importlib.util.spec_from_file_location(
              "aggregate_benchmark", os.environ["AGGREGATOR"])
          agg = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(agg)
          (bench / "benchmark.md").write_text(agg.generate_markdown(data))

          placeholders = sorted(
              k for k, v in meta.items()
              if isinstance(v, str) and v.startswith("<") and v.endswith(">"))
          if placeholders:
              raise SystemExit(
                  "benchmark.json still carries placeholder metadata: "
                  + ", ".join(placeholders))
          print("benchmark metadata:", json.dumps(meta, indent=2))
          PY
          cp "$RUNNER_TEMP/benchmark/benchmark.json" "$RUNNER_TEMP/benchmark-current.json"

      - name: Report against the committed baseline
        if: steps.key.outputs.present == 'true'
        # Informational only. #173 owns turning a delta into an alarm.
        #
        # continue-on-error because "informational" has to mean it. This step
        # once crashed on a formatting detail and, being gated on a plain `if:`,
        # skipped the upload below — discarding a complete, successful, paid-for
        # graded run (#199). A step that cannot change the result must not be
        # able to destroy it.
        #
        # The rendering lives in scripts/eval-report.py rather than a heredoc
        # here (#204). Being a file is what lets scripts/eval-report.test.sh run
        # it against the aggregator's real shape — `delta` as a preformatted
        # string, the unmeasured baseline's nulls, a config the baseline has
        # never seen, an empty run_summary — offline, on every PR. Embedded
        # here, none of that was reachable by any test, and the crash was
        # discovered by a paid nightly instead. `continue-on-error` above limits
        # the damage of a crash; the suite is what stops it happening.
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/eval-report.py \
            --current "$RUNNER_TEMP/benchmark-current.json" \
            --baseline evals/benchmark.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the benchmark
        # always(), because a failed run is exactly when this matters. A graded
        # run costs real money and ~25 minutes of wall clock, and the whole
        # point of `evals/README.md`'s "read the transcript before the score" is
        # that a failure needs its transcripts to be diagnosable at all — a case
        # can fail because the surface never engaged, which is a triggering
        # finding (#172) rather than a behavioural one. Gated on a plain `if:`,
        # this step was skipped when a cosmetic reporting bug failed above it,
        # and a complete successful run was lost outright (#199). Whatever the
        # run produced before dying is worth keeping.
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: behavioural-benchmark
          path: |
            ${{ runner.temp }}/benchmark/benchmark.json
            ${{ runner.temp }}/benchmark/benchmark.md
            ${{ runner.temp }}/benchmark/**/grading.json
            ${{ runner.temp }}/benchmark/**/transcript.md
          retention-days: 30
          # warn, not error: with always() this step legitimately runs in states
          # that produced nothing (the eval step itself died early). Failing the
          # upload there would bury the real cause under a second, misleading
          # failure.
          if-no-files-found: warn
