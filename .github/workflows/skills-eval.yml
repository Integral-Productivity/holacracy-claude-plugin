name: Skills eval (behavioural)

# Tier 2 of the testing model in docs/adr/0012: behavioural evals of the shipped
# skills against synthetic GlassFrog fixtures. Nightly and on demand, never on a
# PR — these cost model calls and wall-clock, and ADR-0012's whole argument is
# that a per-PR gate must be deterministic, offline and sub-second. That gate is
# scripts-test.yml; this is the other tier.
#
# TWO JOBS, AND THE SPLIT IS THE POINT
# ------------------------------------
# `offline` needs no credentials and always runs. It exercises every path in
# scripts/run-behavioural-eval.py except the literal `claude` invocation, and it
# probes each shipped fixture by starting the stub from the config a real run
# would generate. So a broken runner is caught even on a night when the API key
# is missing, rate-limited, or revoked.
#
# `graded` needs ANTHROPIC_API_KEY. When the secret is absent it reports that
# plainly and succeeds. Issue #171 asks for exactly this: the secret is a
# separate human action, and a workflow that goes red every night until someone
# performs it trains people to ignore a red workflow. What it must NOT do is
# report health it did not measure — hence the explicit notice, and hence
# `offline` carrying the assertions that can run unconditionally.
#
# WHY NOT FAIL ON A REGRESSION
# ----------------------------
# The eval-regression alarm is #173, and it is deliberately a separate piece of
# work with the three-layer idempotent shape release-latency-alarm.yml uses. This
# workflow produces benchmark.json and prints the delta against the committed
# baseline; deciding that a delta is a regression is that alarm's job. Wiring a
# threshold in here before the variance of these cases is known is how a flaky
# nightly gets muted.

on:
  schedule:
    # 07:00 UTC — midnight PDT / 23:00 PST the previous evening, so a nightly
    # result is waiting at the start of the operator's day rather than landing
    # mid-morning. GitHub does not guarantee the minute; nothing here depends on
    # it.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      runs:
        description: "Runs per (eval, config). More runs shrink the stddev; the flakiness read in evals/README.md needs at least 3."
        default: "3"
      model:
        description: "Model for both the executor and the grader (blank = the CLI default)"
        default: ""

permissions:
  contents: read

jobs:
  offline:
    name: Runner suite and fixture probes (no credentials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show interpreter versions
        run: |
          set -euo pipefail
          bash --version | head -1
          python3 --version

      - name: run-behavioural-eval regression suite
        # Mutation-checked, same contract as every other suite in this repo: for
        # each mechanical check there is a plan violating only that check, and
        # the suite asserts both that the check fails on it and that no other
        # check incidentally covers it.
        #
        # It substitutes a fake `claude` that replays a plan through the REAL
        # stub over the REAL generated MCP config, so the only thing not
        # exercised here is the model itself.
        run: bash scripts/run-behavioural-eval.test.sh

      - name: Validate every shipped case and probe its fixture
        # Catches the failure mode that would otherwise look like a skill
        # declining to act: a generated MCP config that does not actually start
        # the stub. A run broken this way still produces a transcript.
        run: |
          set -euo pipefail
          args=()
          for f in evals/cases/*/evals.json; do args+=(--case "$f"); done
          python3 scripts/run-behavioural-eval.py --out "$RUNNER_TEMP/probe" \
            --validate-only "${args[@]}"

  graded:
    name: Graded eval run
    needs: offline
    runs-on: ubuntu-latest
    # Measured, not guessed. Run 31053788703 spent ~36 minutes on the eval and
    # aggregate steps for THREE evals at runs=3 — and three only because #201
    # was silently dropping a fourth. Four evals put the same work near 48
    # minutes, which left almost nothing against the previous ceiling of 60.
    # A timeout kills the job mid-step, so the whole budget is spent for no
    # benchmark. #205 tracks tying this number and the `runs` range check
    # together, since they are two descriptions of one constraint.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check for the API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Behavioural evals skipped::ANTHROPIC_API_KEY is not set on this repository, so the graded tier did not run. The offline job still verified the runner and every fixture. Add the secret to enable the nightly graded run (issue #171)."
            {
              echo "## Graded evals skipped"
              echo
              echo "\`ANTHROPIC_API_KEY\` is not configured on this repository."
              echo "The \`offline\` job verified the runner and probed every fixture;"
              echo "nothing was measured about skill behaviour."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: "22"

      - name: Install the Claude Code CLI
        if: steps.key.outputs.present == 'true'
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Fetch skill-creator's aggregator
        if: steps.key.outputs.present == 'true'
        # Cloned rather than vendored. ADR-0012 reuses aggregate_benchmark.py
        # as-is; a copy in this repo would drift from it silently, and the
        # mean ± stddev and with/without delta it computes are the reason the
        # component was chosen over writing one.
        #
        # The price of not vendoring is that upstream's layout is ours to track,
        # and it has already moved once: the path gained a `skills/skill-creator/`
        # segment. Because the graded tier had never actually run — no API key,
        # so every green run took the skip-with-notice path — that break sat
        # latent from the day this workflow was written until the first real
        # dispatch. `test -f` is what turns it into a loud two-second failure
        # instead of a confusing one at the Aggregate step; keep it. The resolved
        # path is exported once so the next upstream move is a one-line fix
        # rather than three edits with a chance of a partial one.
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/anthropics/claude-plugins-official.git "$RUNNER_TEMP/spc"
          git -C "$RUNNER_TEMP/spc" sparse-checkout set \
            plugins/skill-creator/skills/skill-creator/scripts
          AGGREGATOR="$RUNNER_TEMP/spc/plugins/skill-creator/skills/skill-creator/scripts/aggregate_benchmark.py"
          test -f "$AGGREGATOR"
          echo "AGGREGATOR=$AGGREGATOR" >> "$GITHUB_ENV"

      - name: Run the behavioural evals
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNS: ${{ inputs.runs || '3' }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          # Both are workflow_dispatch inputs, so they reach the shell only as
          # environment variables and are never interpolated into the command
          # line. RUNS is additionally range-checked: it is passed to a loop that
          # spends money.
          case "$RUNS" in
            ''|*[!0-9]*) echo "runs must be a positive integer, got '$RUNS'" >&2; exit 1 ;;
          esac
          if [ "$RUNS" -lt 1 ] || [ "$RUNS" -gt 10 ]; then
            echo "runs must be between 1 and 10, got '$RUNS'" >&2; exit 1
          fi
          args=()
          for f in evals/cases/*/evals.json; do args+=(--case "$f"); done
          if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
          python3 scripts/run-behavioural-eval.py \
            --out "$RUNNER_TEMP/benchmark" --runs "$RUNS" "${args[@]}"

      - name: Aggregate
        if: steps.key.outputs.present == 'true'
        run: |
          set -euo pipefail
          python3 "$AGGREGATOR" "$RUNNER_TEMP/benchmark"
          cp "$RUNNER_TEMP/benchmark/benchmark.json" "$RUNNER_TEMP/benchmark-current.json"

      - name: Report against the committed baseline
        if: steps.key.outputs.present == 'true'
        # Informational only. #173 owns turning a delta into an alarm.
        #
        # continue-on-error because "informational" has to mean it. This step
        # once crashed on a formatting detail and, being gated on a plain `if:`,
        # skipped the upload below — discarding a complete, successful, paid-for
        # graded run (#199). A step that cannot change the result must not be
        # able to destroy it.
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib
          cur = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "benchmark-current.json").read_text())
          base_path = pathlib.Path("evals/benchmark.json")
          base = json.loads(base_path.read_text()) if base_path.exists() else {}

          # aggregate_benchmark.py stores a "delta" key INSIDE run_summary,
          # as a sibling of the config keys, and its pass_rate is a
          # preformatted string rather than a stats dict. Upstream excludes it
          # by name everywhere it iterates (`k != "delta"`, its lines 287/389)
          # and so must we — otherwise .get("mean") lands on a str and the
          # whole step dies. That is exactly what #199 was.
          def configs_only(summary):
              return {k: v for k, v in (summary or {}).items() if k != "delta"}

          cur_summary = configs_only(cur.get("run_summary"))
          base_summary = configs_only(base.get("run_summary"))

          def stats_of(entry):
              # Tolerates a null pass_rate, which the unmeasured baseline has.
              return (entry or {}).get("pass_rate") or {}

          print("## Behavioural eval results\n")
          print("| config | pass rate | stddev | baseline | delta |")
          print("|---|---|---|---|---|")
          for config, entry in sorted(cur_summary.items()):
              rate = stats_of(entry)
              bm = stats_of(base_summary.get(config)).get("mean")
              mean = rate.get("mean") or 0
              stddev = rate.get("stddev") or 0
              delta = f"{mean - bm:+.3f}" if isinstance(bm, (int, float)) else "n/a"
              print(f"| {config} | {mean:.3f} | {stddev:.3f} | "
                    f"{bm if bm is not None else 'n/a'} | {delta} |")

          # The aggregator's own with/without delta, which the loop above skips.
          headline = ((cur.get("run_summary") or {}).get("delta") or {}).get("pass_rate")
          if headline:
              print(f"\nwith_skill − without_skill pass rate: **{headline}**")

          wide = [(c, stats_of(e).get("stddev") or 0) for c, e in cur_summary.items()
                  if (stats_of(e).get("stddev") or 0) > 0.2]
          if wide:
              print("\n> **Wide variance.** Per `evals/README.md`, a high-stddev case is a "
                    "defect in the case, not a finding about the skill: "
                    + ", ".join(f"`{c}` ({s:.2f})" for c, s in wide))
          PY

      - name: Upload the benchmark
        # always(), because a failed run is exactly when this matters. A graded
        # run costs real money and ~25 minutes of wall clock, and the whole
        # point of `evals/README.md`'s "read the transcript before the score" is
        # that a failure needs its transcripts to be diagnosable at all — a case
        # can fail because the surface never engaged, which is a triggering
        # finding (#172) rather than a behavioural one. Gated on a plain `if:`,
        # this step was skipped when a cosmetic reporting bug failed above it,
        # and a complete successful run was lost outright (#199). Whatever the
        # run produced before dying is worth keeping.
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: behavioural-benchmark
          path: |
            ${{ runner.temp }}/benchmark/benchmark.json
            ${{ runner.temp }}/benchmark/benchmark.md
            ${{ runner.temp }}/benchmark/**/grading.json
            ${{ runner.temp }}/benchmark/**/transcript.md
          retention-days: 30
          # warn, not error: with always() this step legitimately runs in states
          # that produced nothing (the eval step itself died early). Failing the
          # upload there would bury the real cause under a second, misleading
          # failure.
          if-no-files-found: warn
