name: Scripts tests

# Runs the repo-local bash test suites and lints the scripts. Every `*.test.sh`
# in the repo has a step below; the steps are the coverage, because a committed
# test file nothing invokes reads as coverage while providing none (that is why
# issue #143 was a separate issue from #129).
#
# That is enforced, not remembered: the `test-wiring on this ref` step below
# runs scripts/test-wiring-check.sh, which enumerates every tracked `*.test.sh`
# and fails if any is not invoked by a workflow. Add a suite without adding its
# step and this workflow goes red naming the file. Until issue #186 the rule
# lived in this paragraph alone, which is the weakest enforcement mechanism
# that exists -- the same argument skills-lint.sh's header makes about CLAUDE.md.
#
# Why this exists
# ---------------
# These suites guard instruments whose failure mode is a plausible-looking WRONG
# answer rather than a crash, and none was run by anything until wired here.
#
# scripts/grounding-readout.sh is the Check instrument for the PDCA-1 grounding
# experiment (issue #60, docs/adr/0008-*). Its failure mode is producing a
# plausible-looking number that is WRONG -- exactly the class of defect #123/#124
# repaired. scripts/grounding-readout.test.sh is mutation-checked: disabling any
# single defense in the readout (placeholder exclusion, announce anchoring,
# assistant scoping, subagent exclusion, self exclusion, directive-echo guard,
# marker derivation) fails the suite. Until this workflow existed, nothing ran
# it -- a regression in the readout would have merged green. See issue #126.
#
# scripts/grounding-fire-rate-check.sh and scripts/plugin-version-skew-check.sh
# are the fail-loud alarms for issue #122. Both run OPERATOR-LOCAL, because they
# read ~/.claude/projects and ~/.claude/plugins, which no runner has -- so what
# CI can do is run their suites, which drive them entirely through fixtures
# (--readout-json, --fixture-root, --loaded-json). That split is the point:
# without a fixture path the alarm code would never execute anywhere except the
# moment it fires for real, and an alarm nobody has ever seen fire is the same
# fail-silent shape #122 is about.
#
# hooks-handlers/session-start.sh injects the role-grounding directive and the
# routine briefing. It is fail-silent by design, so every defect in it is
# invisible: issue #122 is a two-week outage nobody could see, and issue #132
# found this suite had been red on the operator's machine while running nowhere.
# The suite is likewise mutation-checked -- see the timezone note on its step
# below, which is also why that step runs under more than one TZ.
#
# Why a new workflow rather than a step in ci.yml
# -----------------------------------------------
# ci.yml is the standard Tier 3 CI and its own header states the convention:
# Tier 3 repos do not standardize a build/test step there; work-type-specific
# CI lives in additional workflows. ci.yml is a thin caller to
# Integral-Productivity/reusable-workflows with no room for repo-local steps,
# and there is no org reusable workflow for "run a bash test script", so a
# direct job is the right shape here.
#
# Why NO paths: filter
# --------------------
# A path-filtered workflow that does not match reports no conclusion at all,
# which is indistinguishable from passing -- the same fail-silent shape this
# suite exists to catch. It is also the trap version-authority.yml documents:
# a skipped check configured as REQUIRED blocks a PR forever, waiting on a
# status that never arrives. A `scripts/**`-only filter would additionally miss
# a real failure mode, because test section 9 derives the directive marker from
# the live hooks-handlers/session-start.sh -- a change to the hook alone can
# break the suite. The run costs well under a second, so filtering buys nothing.
#
# The `push: main` leg is the backstop for a direct push to main, which is
# possible today (main carries no ruleset) and which a pull_request-scoped
# check structurally cannot see.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts-test:
    name: Run scripts test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show interpreter versions
        # The suite needs bash, python3 (JSONL parsing in the readout) and git
        # (test section 8 derives this repo's own project slug via
        # `git rev-parse --git-common-dir` to prove self-exclusion). Printing
        # them makes a runner-image change self-diagnosing instead of surfacing
        # as an unexplained test failure.
        run: |
          set -euo pipefail
          bash --version | head -1
          python3 --version
          git --version

      - name: Shellcheck scripts/*.sh
        # PINNED, and both halves of the pin are deliberate (issue #209).
        #
        # WHICH VERSION. Until #209 this step ran whatever shellcheck the
        # ubuntu-latest image happened to ship -- 0.9.0 at the time -- while the
        # operator's Homebrew ran 0.11.0. The two disagreed, and because
        # shellcheck exits non-zero on ANY finding, the disagreement decided
        # whether the build was red: PR #207 passed this command locally and
        # failed it in CI on an `info`-severity SC2015. The direction that bit
        # was the benign one (CI stricter, defect caught); the same mechanism in
        # reverse -- a runner-image bump relaxing a check -- is silent. Either
        # way a green local run carried no information about CI, which guts the
        # fast offline gate ADR-0012 puts at the centre of the testing model.
        # So the version is downloaded from the upstream release and its digest
        # verified, rather than inherited from someone else's schedule.
        #
        # WHAT COUNTS AS FAILURE. `--severity` is stated rather than defaulted.
        # The default is `style`, i.e. fail on any finding at all -- which is
        # the policy this repo wants, but it was never chosen, it was inherited.
        # Written down, it is now one visible token to change if that stops
        # being true, instead of a property of shellcheck's defaults.
        #
        # TO BUMP: change SHELLCHECK_VERSION, run the `shasum -a 256` line below
        # against the new tarball and paste the result into SHELLCHECK_SHA256,
        # then re-run this workflow. The digest is not optional -- without it the
        # "pin" is a URL upstream can re-point. Tell contributors to install the
        # matching version locally too (`brew install shellcheck` tracks latest;
        # check `shellcheck --version` against the pin), or the local gate goes
        # back to meaning nothing.
        #
        #   curl -sSL --fail -o sc.tar.xz \
        #     https://github.com/koalaman/shellcheck/releases/download/vX.Y.Z/shellcheck-vX.Y.Z.linux.x86_64.tar.xz
        #   shasum -a 256 sc.tar.xz
        #
        # x86_64 is hard-coded because ubuntu-latest is x86_64. If that changes,
        # the download 404s and this step fails loudly, which is the intended
        # outcome -- a wrong-architecture binary must not be silently skipped.
        env:
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
          # style = every finding, including info and style notes. See above.
          SHELLCHECK_SEVERITY: style
        run: |
          set -euo pipefail
          tarball="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${tarball}"

          curl -sSL --fail -o "$RUNNER_TEMP/$tarball" "$url"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" \
            "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          sc="$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck"

          # Assert the binary is the pinned one rather than trusting the path.
          # A stale extraction or a shadowed name would otherwise run some other
          # shellcheck while this step reported the pin -- the fail-silent shape
          # the whole pin exists to remove.
          #
          # Captured to a variable rather than piped to `grep -q`, which exits on
          # first match and SIGPIPEs the writer; under `pipefail` that turns a
          # SUCCESSFUL match into a failed pipeline whenever the output is large
          # enough not to fit the pipe buffer.
          version_output=$("$sc" --version)
          printf '%s\n' "$version_output"
          if ! printf '%s\n' "$version_output" | grep -qx "version: ${SHELLCHECK_VERSION}"; then
            echo "::error::shellcheck is not the pinned ${SHELLCHECK_VERSION}"
            exit 1
          fi

          "$sc" --severity="${SHELLCHECK_SEVERITY}" scripts/*.sh

      - name: test-wiring regression suite
        # Mutation-checked, same contract as the suites below: for each defense
        # (wiring, verb, comments, boundary) there is a fixture violating only
        # that defense, and the suite asserts BOTH that the guard fails on it
        # AND that it passes with that defense disabled. The second half is what
        # proves no defense is dead weight.
        #
        # Hermetic: every fixture is a throwaway git repo driven through
        # --root, because the guard reads its corpora with `git ls-files` and
        # tracked-ness is part of the contract rather than a detail to stub.
        run: bash scripts/test-wiring-check.test.sh

      - name: test-wiring on this ref
        # The enforcement the header promises. Every tracked *.test.sh must be
        # invoked by a workflow; add a suite without adding its step and this
        # step goes red naming the file.
        #
        # Runs FIRST among the on-this-ref checks deliberately. If a suite were
        # unwired, every step below would still pass -- that is the whole defect
        # -- so this is the only step that can report it.
        run: bash scripts/test-wiring-check.sh

      - name: grounding-readout regression suite
        run: bash scripts/grounding-readout.test.sh

      - name: grounding-fire-rate-check regression suite
        # Section 8 of this suite runs the check under `env -i` with a PATH
        # carrying neither gh nor jq, proving --dry-run stays runnable here.
        # Section 9 drives it through the REAL grounding-readout.sh, so a
        # renamed JSON key fails the build instead of turning the alarm into a
        # permanent silent zero.
        run: bash scripts/grounding-fire-rate-check.test.sh

      - name: plugin-version-skew-check regression suite
        # Builds a reproduction of the exact issue #122 condition -- a v0.6.0
        # copy materialized by the desktop app while installed_plugins.json
        # reports 0.10.2 -- and asserts the alarm fires on it. Issue #150 asks
        # for the alarm to be demonstrated against a reproduction rather than
        # asserted; this step is that demonstration, on every PR.
        run: bash scripts/plugin-version-skew-check.test.sh

      - name: release-pr-age-check regression suite
        # scripts/release-pr-age-check.sh is the alarm for issue #129: a release
        # PR left open means "merged" and "shipped" have drifted apart, and they
        # drifted 34 days once with nothing anywhere reporting it. Until issue
        # #143 this script was covered by `shellcheck scripts/*.sh` and nothing
        # else -- and shellcheck has no opinion about whether the threshold
        # comparison is the right way round. A regression making the alarm
        # always report "no alarm" would have merged green, which is the same
        # fail-silent shape the script exists to catch, one level up.
        #
        # Hermetic: `--now` and `--pr-json` are the script's own affordances,
        # and the suite adds a stub `gh` plus BSD-only and GNU-only `date` stubs
        # on PATH, so no network and no real repository are involved. Mutation-
        # checked to the same contract as the suites above -- section 9 seeds
        # one defect at a time (branch prefix, age arithmetic, threshold
        # comparison, each half of the BSD/GNU date fallback) and asserts the
        # matching property flips.
        run: bash scripts/release-pr-age-check.test.sh

      - name: session-start hook regression suite
        # Run under two timezones deliberately -- this is not redundancy.
        #
        # The hook decides whether a routine is due by comparing a ledger
        # timestamp's calendar date against today's. Issue #132: it took .date()
        # off the UTC instant and compared it to a LOCAL today, so a routine due
        # today silently failed to surface for the hours the two dates disagree.
        # Under a UTC runner those two dates NEVER disagree, so the whole class
        # of bug is invisible here. Mutation-checked: removing the local
        # normalization in _date() passes under TZ=UTC and fails under every
        # non-UTC zone tried (America/Los_Angeles, Europe/Berlin, Asia/Tokyo,
        # Pacific/Kiritimati, Pacific/Midway).
        #
        # America/Los_Angeles is the operator's zone and carries a DST
        # transition, so it also exercises a changing offset. Keep both legs.
        run: |
          set -euo pipefail
          for tz in UTC America/Los_Angeles; do
            echo "::group::session-start.test.sh (TZ=$tz)"
            TZ="$tz" bash hooks-handlers/session-start.test.sh
            echo "::endgroup::"
          done

      - name: skills-lint regression suite
        # Mutation-checked, same contract as the two suites above: for each of
        # the six checks there is a fixture violating only that check, and the
        # suite asserts BOTH that the lint fails on it AND that it passes with
        # that check skipped. The second assertion is what proves no check is
        # dead weight -- a check some other check incidentally covers would pass
        # a naive suite while buying nothing.
        run: bash scripts/skills-lint.test.sh

      - name: skills-lint on this ref
        # The suite above proves the checks work against fixtures. This runs
        # them against the actual plugin, which is the point.
        #
        # --base is passed only on pull_request, because check 4 (a skill's
        # `version:` moved when its content did) is inherently diff-aware and
        # has nothing to compare against on a push to main. It is skipped rather
        # than faked, so the check never reports a conclusion it cannot support.
        #
        # SKILLS_LINT_CHECK_ISSUES turns on the leg of check 5 that asks GitHub
        # whether a declared forward reference's tracking issue is still open.
        # That needs `gh` authenticated, which is true here and not on a laptop,
        # so the local run degrades to accepting the declaration alone.
        env:
          GH_TOKEN: ${{ github.token }}
          SKILLS_LINT_CHECK_ISSUES: "1"
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            bash scripts/skills-lint.sh --base "origin/${{ github.base_ref }}"
          else
            bash scripts/skills-lint.sh
          fi

      - name: evals fixture-harness regression suite
        # Guards the behavioural-eval fixture harness (#170): schema capture,
        # synthetic fixture generation, and the MCP replay stub.
        #
        # Section 2 of that suite is a LEAK GUARD, and it is the reason this step
        # is not optional. Fixtures live in a public repository; the live API
        # returns filler names and email addresses on every role record, plus
        # purposes, accountabilities and domains. The harness is built so that no
        # real string has a path into a committed file, and the guard asserts
        # that property rather than trusting it.
        #
        # A leak is also not undone by a later commit — it is in git history — so
        # the guard runs over the whole of evals/ on every PR, not over the files
        # a given change happens to touch.
        run: bash scripts/evals-harness.test.sh

      - name: eval-report regression suite
        # Guards scripts/eval-report.py (#204), which renders the graded run's
        # summary against the committed baseline.
        #
        # That block crashed once and took a complete, paid-for graded run with
        # it (#199): it called .get("mean") on run_summary["delta"]["pass_rate"],
        # which aggregate_benchmark.py stores as a preformatted STRING. The step
        # died, the artifact upload gated below it was skipped, and ~25 minutes
        # of paid execution was discarded. The fix was verified by hand, and
        # until this suite nothing in the repo would have caught it again.
        #
        # It is here rather than only in skills-eval.yml for the same reason the
        # runner's suite is: the code parses a schema owned by an EXTERNAL
        # repository pinned at a commit we bump deliberately (#195), and it runs
        # only in the graded tier — nightly at best, real money to exercise.
        # Extracting it from a heredoc is what made any of it reachable by a
        # test at all.
        #
        # Mutation-checked on the same contract as the suites around it: four
        # defenses, four mutants removing exactly one each, and both halves
        # asserted. Three of the four are one-token differences — `.get(k)` vs
        # `[k]`, `or {}` vs nothing — which is precisely the kind of defense a
        # naive suite would leave unproven.
        run: bash scripts/eval-report.test.sh

      - name: behavioural eval runner regression suite
        # Guards scripts/run-behavioural-eval.py (#171), the runner that turns a
        # golden case into a grading.json.
        #
        # It belongs on the PR gate rather than only in skills-eval.yml, even
        # though the runner itself only runs nightly. That asymmetry is the whole
        # reason: an instrument that executes once a day, against a secret no
        # laptop holds, is issue #122's shape exactly — nobody watches it, and
        # its failure mode is a plausible-looking wrong number rather than a
        # crash. The suite substitutes a fake `claude` that replays a plan
        # through the REAL stub over the REAL generated MCP config, so every path
        # except the model is exercised here, offline, on every PR.
        #
        # Mutation-checked on the same contract as the suites above: for each
        # mechanical check there is a plan violating only that check, and the
        # suite asserts both that the check fails on it and that no other check
        # incidentally covers it. Two of its cases exist because the runner
        # actually had the defect: a dead executor and an unauthenticated session
        # each scored every NEGATIVE assertion green, since a model that never
        # ran issues no forbidden write.
        run: bash scripts/run-behavioural-eval.test.sh

      - name: cache-key-completeness-check regression suite
        # Guards scripts/cache-key-completeness-check.sh (R7), the static
        # assertion that CACHE_KEY_INPUT_CLASSES and compute_cache_key's own
        # source in run-behavioural-eval.py agree about which file-tree input
        # classes participate in the nightly eval's change-aware cache key.
        #
        # Parallel to skills-lint.sh check 4's skill-version enforcement: a
        # documentation comment saying the enumeration is exhaustive "by
        # design" is not enforcement, and this repo already learned that
        # lesson once (skills-lint.sh's own header). Without this check,
        # CACHE_KEY_INPUT_CLASSES could drift out of sync with
        # compute_cache_key's body in either direction — a listed class the
        # code stopped reading, or a newly hashed input nobody added to the
        # list — and a cache hit would silently mask an actual change.
        #
        # Mutation-checked on the same contract as the suites above: for each
        # of the two directions (enumeration -> code, code -> enumeration)
        # there is a fixture violating only that direction, and the suite
        # asserts both that the check fails on it and that it passes with
        # that direction skipped, plus an explicit cross-isolation assertion
        # that neither direction's fixture trips the other.
        run: bash scripts/cache-key-completeness-check.test.sh

      - name: cache-key-completeness-check on this ref
        # The suite above proves the check works against fixtures. This runs
        # it against the actual run-behavioural-eval.py, which is the point.
        # Static, no --base needed — it reads one file's current source.
        run: bash scripts/cache-key-completeness-check.sh
