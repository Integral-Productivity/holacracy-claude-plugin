name: Scripts tests

# Runs the repo-local bash test suites and lints the scripts. Every `*.test.sh`
# in the repo should have a step below; the steps are the coverage, because a
# committed test file nothing invokes reads as coverage while providing none
# (that is why issue #143 was a separate issue from #129).
#
# Why this exists
# ---------------
# These suites guard instruments whose failure mode is a plausible-looking WRONG
# answer rather than a crash, and none was run by anything until wired here.
#
# scripts/grounding-readout.sh is the Check instrument for the PDCA-1 grounding
# experiment (issue #60, docs/adr/0008-*). Its failure mode is producing a
# plausible-looking number that is WRONG -- exactly the class of defect #123/#124
# repaired. scripts/grounding-readout.test.sh is mutation-checked: disabling any
# single defense in the readout (placeholder exclusion, announce anchoring,
# assistant scoping, subagent exclusion, self exclusion, directive-echo guard,
# marker derivation) fails the suite. Until this workflow existed, nothing ran
# it -- a regression in the readout would have merged green. See issue #126.
#
# scripts/grounding-fire-rate-check.sh and scripts/plugin-version-skew-check.sh
# are the fail-loud alarms for issue #122. Both run OPERATOR-LOCAL, because they
# read ~/.claude/projects and ~/.claude/plugins, which no runner has -- so what
# CI can do is run their suites, which drive them entirely through fixtures
# (--readout-json, --fixture-root, --loaded-json). That split is the point:
# without a fixture path the alarm code would never execute anywhere except the
# moment it fires for real, and an alarm nobody has ever seen fire is the same
# fail-silent shape #122 is about.
#
# hooks-handlers/session-start.sh injects the role-grounding directive and the
# routine briefing. It is fail-silent by design, so every defect in it is
# invisible: issue #122 is a two-week outage nobody could see, and issue #132
# found this suite had been red on the operator's machine while running nowhere.
# The suite is likewise mutation-checked -- see the timezone note on its step
# below, which is also why that step runs under more than one TZ.
#
# Why a new workflow rather than a step in ci.yml
# -----------------------------------------------
# ci.yml is the standard Tier 3 CI and its own header states the convention:
# Tier 3 repos do not standardize a build/test step there; work-type-specific
# CI lives in additional workflows. ci.yml is a thin caller to
# Integral-Productivity/reusable-workflows with no room for repo-local steps,
# and there is no org reusable workflow for "run a bash test script", so a
# direct job is the right shape here.
#
# Why NO paths: filter
# --------------------
# A path-filtered workflow that does not match reports no conclusion at all,
# which is indistinguishable from passing -- the same fail-silent shape this
# suite exists to catch. It is also the trap version-authority.yml documents:
# a skipped check configured as REQUIRED blocks a PR forever, waiting on a
# status that never arrives. A `scripts/**`-only filter would additionally miss
# a real failure mode, because test section 9 derives the directive marker from
# the live hooks-handlers/session-start.sh -- a change to the hook alone can
# break the suite. The run costs well under a second, so filtering buys nothing.
#
# The `push: main` leg is the backstop for a direct push to main, which is
# possible today (main carries no ruleset) and which a pull_request-scoped
# check structurally cannot see.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts-test:
    name: Run scripts test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show interpreter versions
        # The suite needs bash, python3 (JSONL parsing in the readout) and git
        # (test section 8 derives this repo's own project slug via
        # `git rev-parse --git-common-dir` to prove self-exclusion). Printing
        # them makes a runner-image change self-diagnosing instead of surfacing
        # as an unexplained test failure.
        run: |
          set -euo pipefail
          bash --version | head -1
          python3 --version
          git --version

      - name: Shellcheck scripts/*.sh
        # shellcheck ships on the ubuntu-latest image; install it if a future
        # image drops it rather than failing with an opaque exit 127.
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "shellcheck not on the runner image; installing from apt"
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck --version | head -2
          shellcheck scripts/*.sh

      - name: grounding-readout regression suite
        run: bash scripts/grounding-readout.test.sh

      - name: grounding-fire-rate-check regression suite
        # Section 8 of this suite runs the check under `env -i` with a PATH
        # carrying neither gh nor jq, proving --dry-run stays runnable here.
        # Section 9 drives it through the REAL grounding-readout.sh, so a
        # renamed JSON key fails the build instead of turning the alarm into a
        # permanent silent zero.
        run: bash scripts/grounding-fire-rate-check.test.sh

      - name: plugin-version-skew-check regression suite
        # Builds a reproduction of the exact issue #122 condition -- a v0.6.0
        # copy materialized by the desktop app while installed_plugins.json
        # reports 0.10.2 -- and asserts the alarm fires on it. Issue #150 asks
        # for the alarm to be demonstrated against a reproduction rather than
        # asserted; this step is that demonstration, on every PR.
        run: bash scripts/plugin-version-skew-check.test.sh

      - name: release-pr-age-check regression suite
        # scripts/release-pr-age-check.sh is the alarm for issue #129: a release
        # PR left open means "merged" and "shipped" have drifted apart, and they
        # drifted 34 days once with nothing anywhere reporting it. Until issue
        # #143 this script was covered by `shellcheck scripts/*.sh` and nothing
        # else -- and shellcheck has no opinion about whether the threshold
        # comparison is the right way round. A regression making the alarm
        # always report "no alarm" would have merged green, which is the same
        # fail-silent shape the script exists to catch, one level up.
        #
        # Hermetic: `--now` and `--pr-json` are the script's own affordances,
        # and the suite adds a stub `gh` plus BSD-only and GNU-only `date` stubs
        # on PATH, so no network and no real repository are involved. Mutation-
        # checked to the same contract as the suites above -- section 9 seeds
        # one defect at a time (branch prefix, age arithmetic, threshold
        # comparison, each half of the BSD/GNU date fallback) and asserts the
        # matching property flips.
        run: bash scripts/release-pr-age-check.test.sh

      - name: session-start hook regression suite
        # Run under two timezones deliberately -- this is not redundancy.
        #
        # The hook decides whether a routine is due by comparing a ledger
        # timestamp's calendar date against today's. Issue #132: it took .date()
        # off the UTC instant and compared it to a LOCAL today, so a routine due
        # today silently failed to surface for the hours the two dates disagree.
        # Under a UTC runner those two dates NEVER disagree, so the whole class
        # of bug is invisible here. Mutation-checked: removing the local
        # normalization in _date() passes under TZ=UTC and fails under every
        # non-UTC zone tried (America/Los_Angeles, Europe/Berlin, Asia/Tokyo,
        # Pacific/Kiritimati, Pacific/Midway).
        #
        # America/Los_Angeles is the operator's zone and carries a DST
        # transition, so it also exercises a changing offset. Keep both legs.
        run: |
          set -euo pipefail
          for tz in UTC America/Los_Angeles; do
            echo "::group::session-start.test.sh (TZ=$tz)"
            TZ="$tz" bash hooks-handlers/session-start.test.sh
            echo "::endgroup::"
          done

      - name: skills-lint regression suite
        # Mutation-checked, same contract as the two suites above: for each of
        # the six checks there is a fixture violating only that check, and the
        # suite asserts BOTH that the lint fails on it AND that it passes with
        # that check skipped. The second assertion is what proves no check is
        # dead weight -- a check some other check incidentally covers would pass
        # a naive suite while buying nothing.
        run: bash scripts/skills-lint.test.sh

      - name: skills-lint on this ref
        # The suite above proves the checks work against fixtures. This runs
        # them against the actual plugin, which is the point.
        #
        # --base is passed only on pull_request, because check 4 (a skill's
        # `version:` moved when its content did) is inherently diff-aware and
        # has nothing to compare against on a push to main. It is skipped rather
        # than faked, so the check never reports a conclusion it cannot support.
        #
        # SKILLS_LINT_CHECK_ISSUES turns on the leg of check 5 that asks GitHub
        # whether a declared forward reference's tracking issue is still open.
        # That needs `gh` authenticated, which is true here and not on a laptop,
        # so the local run degrades to accepting the declaration alone.
        env:
          GH_TOKEN: ${{ github.token }}
          SKILLS_LINT_CHECK_ISSUES: "1"
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            bash scripts/skills-lint.sh --base "origin/${{ github.base_ref }}"
          else
            bash scripts/skills-lint.sh
          fi

      - name: evals fixture-harness regression suite
        # Guards the behavioural-eval fixture harness (#170): schema capture,
        # synthetic fixture generation, and the MCP replay stub.
        #
        # Section 2 of that suite is a LEAK GUARD, and it is the reason this step
        # is not optional. Fixtures live in a public repository; the live API
        # returns filler names and email addresses on every role record, plus
        # purposes, accountabilities and domains. The harness is built so that no
        # real string has a path into a committed file, and the guard asserts
        # that property rather than trusting it.
        #
        # A leak is also not undone by a later commit — it is in git history — so
        # the guard runs over the whole of evals/ on every PR, not over the files
        # a given change happens to touch.
        run: bash scripts/evals-harness.test.sh
